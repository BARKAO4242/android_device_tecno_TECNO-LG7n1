name: Build TWRP Boot Image for Tecno Pova 4

on:
  workflow_dispatch:

jobs:
  build_boot:
    runs-on: ubuntu-latest
    env:
      DEVICE_CODENAME: LG7n
      TWRP_BRANCH: twrp-12.1
    steps:
      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl wget unzip zip clang make python3 python3-pip openjdk-17-jdk bc bison flex libssl-dev

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          repo --version

      - name: Initialize TWRP Repo
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $TWRP_BRANCH
          repo sync -j8 --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

      - name: Setup Build Environment
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_LG7n-eng

      - name: Build Boot Image
        run: |
          cd ~/twrp
          m bootimage

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp_boot_img
          path: ~/twrp/out/target/product/LG7n/boot.img
