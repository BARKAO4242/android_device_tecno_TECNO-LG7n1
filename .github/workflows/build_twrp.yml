name: Build TWRP Boot Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-twrp:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/twrp

    steps:
      # 1️⃣ Checkout workflow repository (opsiyonel)
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Setup repo command
      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH=$HOME/bin:$PATH' >> $GITHUB_ENV

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip

      # 4️⃣ Initialize TWRP repo
      - name: Initialize repo
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j8 --no-clone-bundle --no-tags

      # 5️⃣ Clone device tree
      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

      # 6️⃣ Setup build environment
      - name: Source envsetup
        run: |
          cd ~/twrp
          source build/envsetup.sh || echo "envsetup.sh yoksa hata yoksayılıyor"

      # 7️⃣ Select device lunch
      - name: Lunch target
        run: |
          cd ~/twrp
          export TARGET_PRODUCT=omni_LG7n
          export TARGET_BUILD_VARIANT=eng
          export TARGET_BUILD_TYPE=boot

      # 8️⃣ Build boot.img
      - name: Build TWRP boot.img
        run: |
          cd ~/twrp
          make bootimage -j$(nproc)

      # 9️⃣ Upload artifact
      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-boot-LG7n
          path: ~/twrp/out/target/product/LG7n/boot.img
