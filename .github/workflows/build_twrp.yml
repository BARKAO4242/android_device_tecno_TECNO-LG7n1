name: Build TWRP for Tecno Pova 4

on:
  workflow_dispatch:

env:
  REPO_DIR: ${{ github.workspace }}/twrp
  DEVICE_TREE: https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git
  DEVICE_PATH: device/tecno/LG7n
  DEVICE_NAME: LG7n
  TWRP_BRANCH: twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        chmod a+x ~/bin/repo
        echo "export PATH=~/bin:$PATH" >> ~/.bashrc
        source ~/.bashrc

    - name: Initialize TWRP manifest
      run: |
        mkdir -p $REPO_DIR
        cd $REPO_DIR
        ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $TWRP_BRANCH --depth=1
        ~/bin/repo sync -j4

    - name: Clone device tree
      run: |
        cd $REPO_DIR
        git clone $DEVICE_TREE $DEVICE_PATH

    - name: Prepare environment
      run: |
        cd $REPO_DIR
        source build/envsetup.sh || true
        export ALLOW_MISSING_DEPENDENCIES=true

    - name: Build TWRP boot image
      run: |
        cd $REPO_DIR
        source build/envsetup.sh
        lunch omni_${DEVICE_NAME}-eng
        mka bootimage -j$(nproc)

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Boot-${{ env.DEVICE_NAME }}
        path: ${{ env.REPO_DIR }}/out/target/product/${{ env.DEVICE_NAME }}/boot.img
