name: Build TWRP for Tecno Pova 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python3 openjdk-17-jdk wget clang

    - name: Install repo
  run: |
    mkdir -p ~/bin
    curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
    chmod a+x ~/bin/repo
    ~/bin/repo --version
      
        
        
        
        
        
        

    - name: Initialize TWRP minimal manifest
  run: |
    mkdir -p ~/twrp && cd ~/twrp
    ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

- name: Sync sources
  run: |
    cd ~/twrp
    ~/bin/repo sync -c --no-clone-bundle --no-tags -j4
      
        
        

    - name: Sync sources
      run: |
        cd ~/twrp
        ~/bin/repo sync -c --no-clone-bundle --no-tags -j4

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

    - name: Build TWRP boot image
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh || true
        lunch omni_TECNO-LG7n-eng || true
        make bootimage -j4

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: twrp-boot-Tecno-Pova4
        path: ~/twrp/out/target/product/*/boot.img
