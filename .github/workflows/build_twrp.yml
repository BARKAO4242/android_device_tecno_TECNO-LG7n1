name: Build TWRP 12.1 for Tecno Pova 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: ${{ github.workspace }}/twrp

    steps:
    - name: Checkout workflow repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl wget unzip zip build-essential clang make python3 python3-pip openjdk-17-jdk bc bison flex

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP repo
      run: |
        mkdir -p $REPO_DIR
        cd $REPO_DIR
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j8 --force-sync --no-tags --no-clone-bundle

    - name: Clone device tree
      run: |
        cd $REPO_DIR
        git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

    - name: Setup build environment
      run: |
        cd $REPO_DIR
        source build/envsetup.sh
        lunch omni_LG7n-eng

    - name: Build boot.img
      run: |
        cd $REPO_DIR
        m bootimage

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_boot_LG7n
        path: $REPO_DIR/out/target/product/LG7n/boot.img
