name: Build TWRP for Tecno Pova 4 (LG7n)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Clean up space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev \
        libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig openjdk-17-jdk python3

    - name: Initialize repo
      run: |
        mkdir ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

    - name: Sync sources
      run: |
        cd ~/twrp
        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

    - name: Setup environment
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch omni_LG7n-eng || true

    - name: Build boot.img
      run: |
        cd ~/twrp
        make bootimage -j$(nproc)

    - name: Upload output
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-boot-LG7n
        path: out/target/product/LG7n/boot.img
