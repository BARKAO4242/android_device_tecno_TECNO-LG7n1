name: Build TWRP 12.1 Boot Image for TECNO-LG7n

on:
  workflow_dispatch:

jobs:
  build-twrp:
    runs-on: ubuntu-24.04
    env:
      DEVICE: LG7n
      TWRP_BRANCH: twrp-12.1
      REPO_DIR: ${{ github.workspace }}/twrp

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev \
          libx11-dev lib32z1-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip \
          python3 python3-pip openjdk-17-jdk

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          repo --version
        
          
          
          
          
          
        
          
          
          
          
    

      - name: Initialize TWRP Repo
        run: |
          mkdir -p $REPO_DIR
          cd $REPO_DIR
          repo init -u https://github.com/TeamWin/android_manifest.git -b $TWRP_BRANCH

      - name: Sync Repo
        run: |
          cd $REPO_DIR
          repo sync -j8 --force-sync

      - name: Clone Device Tree
        run: |
          cd $REPO_DIR
          git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

      - name: Set up Build Environment
        run: |
          cd $REPO_DIR
          source build/envsetup.sh || true
          export USE_CCACHE=1
          ccache -M 50G

      - name: Lunch Target
        run: |
          cd $REPO_DIR
          lunch omni_${DEVICE}-eng || true

      - name: Build Boot Image
        run: |
          cd $REPO_DIR
          m bootimage || m recoveryimage || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: $REPO_DIR/out/target/product/${DEVICE}/boot.img
