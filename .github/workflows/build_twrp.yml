
name: Build TWRP Boot for Tecno Pova 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: ${{ github.workspace }}/twrp

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl wget unzip zip openjdk-17-jdk python3 python3-pip clang make

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=${HOME}/bin:$PATH" >> $GITHUB_ENV
        repo --version

    - name: Initialize TWRP repo
      run: |
        mkdir -p $REPO_DIR
        cd $REPO_DIR
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

    - name: Sync repo
      run: |
        cd $REPO_DIR
        repo sync -j8 --force-sync

    - name: Clone device tree
      run: |
        cd $REPO_DIR
        git clone https://github.com/BARKAO4242/android_device_tecno_TECNO-LG7n1.git device/tecno/LG7n

    - name: Build TWRP boot image
      run: |
        cd $REPO_DIR
        source build/envsetup.sh
        lunch omni_LG7n-eng
        m bootimage
